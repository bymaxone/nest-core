# Build scripts are denied by default since pnpm 10; these two are the only
# dependencies that legitimately need one — esbuild fetches its platform binary
# and unrs-resolver its native addon. Without this, `pnpm install` fails with
# ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json,
# so an override placed there is ignored — with a warning, but ignored.
overrides:
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.5'
  'qs': '^6.15.2'
