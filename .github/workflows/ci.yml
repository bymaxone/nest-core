# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (install, lint, typecheck, unit+coverage, mutation) run
# via node-lib-ci.yml. This library's extra verification (build output integrity
# across all three subpaths, bundle-size budget) stays here. The unit command
# covers both unit and e2e via jest.coverage.config.ts, so there is no separate
# e2e job. Mutation runs only on a push to main / manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'

  # Library-specific verification: full build, output integrity across every
  # declared subpath, and the brotli bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # type declarations. A missing artifact here indicates a tsup
        # misconfiguration that would ship a broken package to npm.
        #
        # The list is derived from the `exports` map rather than written out
        # here: a hardcoded list silently stops covering a subpath the moment
        # one is added, which is the failure this step exists to catch.
        run: |
          node -e "
            const { existsSync } = require('node:fs');
            const entries = Object.entries(require('./package.json').exports)
              .filter(([subpath]) => subpath !== './package.json');
            const missing = entries.flatMap(([subpath, entry]) =>
              [entry.import.types, entry.import.default, entry.require.types, entry.require.default]
                .filter((file) => !existsSync(file))
                .map((file) => subpath + ' -> ' + file)
            );
            if (missing.length) {
              console.error('Missing build output:\n  ' + missing.join('\n  '));
              process.exit(1);
            }
            console.log(entries.length + ' subpaths produced ESM + CJS + .d.ts + .d.cts');
          "
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may
        # still land on declarations for the wrong module format. `attw` packs
        # the tarball and resolves every entry point as each mode would.
        run: pnpm check:exports
      - name: Consumer load
        # attw proves the declarations resolve; it never runs the JavaScript.
        # This loads every subpath from the packed tarball in ESM and CommonJS.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
