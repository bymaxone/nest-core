# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — reusable CI propagates by reference, this
# one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly. Monday already carries four scheduled runs in this repository
    # (scorecard, mutation-full, codeql, peer-advisory-drift), so this one sits
    # on Thursday and off the hour to keep them from clustering.
    - cron: '23 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # Authentication is a GitHub App: the called workflow mints an
      # installation token per run, so the credential that reaches a run expires
      # within the hour. The App's private key behind AGENTS_SYNC_PRIVATE_KEY is
      # long-lived and installed org-wide with write access, so it carries a
      # rotation requirement of its own.
      #
      # Both are organisation secrets with `visibility: all`, so this repository
      # reads them with no configuration here. Named rather than passed with
      # `inherit`, so the called workflow receives these two and not every secret
      # this repository holds.
      #
      # Supply both or neither: the called workflow refuses a run where exactly
      # one is set, rather than falling back and presenting as a repository that
      # never configured an App.
      #
      # `sync-token` is a declared input of the called workflow with no
      # credential behind it in this organisation, so it is unmapped. Mapping it
      # would guard nothing either way: the callee resolves
      # `app-token || sync-token || github.token`, where an unmapped secret and
      # one mapped to a missing secret are alike empty and alike fall through.
      #
      # Both App secrets absent is therefore a legal state, and the
      # half-configured guard accepts it. The callee warns rather than refuses
      # there, deliberately: `sync-token` is optional and `github.token` is a
      # documented fallback, so a repository that requires no status checks can
      # run credential-free. This one does require them, so the same fallback
      # opens a pull request that starts none of its required checks and cannot
      # merge — an annotation on a green run, not a failure.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
