# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — reusable CI propagates by reference, this
# one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly. Monday already carries four scheduled runs in this repository
    # (scorecard, mutation-full, codeql, peer-advisory-drift), so this one sits
    # on Thursday and off the hour to keep them from clustering.
    - cron: '23 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # A GitHub App, which is what the called workflow prefers: it mints an
      # installation token per run, so the credential that reaches the run
      # expires within the hour. The App's private key behind
      # AGENTS_SYNC_PRIVATE_KEY is itself long-lived and installed org-wide with
      # write access, so it still needs rotation hygiene — what changes is that
      # nothing expires unnoticed mid-run, not that there is nothing to rotate.
      #
      # Both are organisation secrets with `visibility: all`, so this repository
      # already reads them and nothing has to be configured here. Named rather
      # than passed with `inherit`, so the called workflow receives these two and
      # not every secret this repository holds.
      #
      # Supplied together or not at all: the called workflow refuses a run where
      # exactly one is set, rather than falling back and looking like a
      # repository that never configured an App.
      #
      # `sync-token` is left unmapped because there is no credential for it, not
      # because unmapping protects anything. The callee resolves
      # `app-token || sync-token || github.token`, and an unmapped secret and one
      # mapped to a missing secret are indistinguishable there — both are empty
      # and both fall through. **Losing both App secrets is therefore still
      # silent**: the half-configured guard only catches exactly one, both-unset
      # is a legal state, and the run would open a pull request with the default
      # GITHUB_TOKEN that starts none of this repository's required checks.
      # Nothing in this file closes that; only a both-unset error in the callee
      # would.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
