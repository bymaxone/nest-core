name: CodeQL

# Runs on every push to `main`, on every PR targeting `main`, and on a weekly
# cron; the weekly schedule catches new CVEs in patterns that did not change
# in code. `workflow_dispatch` is kept for ad-hoc re-runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only at the workflow level. The analyze job widens to
# `security-events: write` only where it needs to upload SARIF.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning (SARIF upload) requires the repository to be public or to
    # have GitHub Advanced Security enabled. Gate the analysis on public
    # visibility so it activates automatically once the repository is published
    # and never produces a false CI failure while the repository is private.
    if: ${{ github.event.repository.private == false }}

    permissions:
      contents: read
      # Required for CodeQL to upload its findings to the Security tab.
      security-events: write
      # Required on private repositories so the analyze step can read
      # workflow-run metadata via the Actions API during SARIF upload.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds higher-signal queries beyond the default set,
          # appropriate for a foundation package whose exception filter and
          # timing interceptor process request payloads, headers, and error
          # objects on every request.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
