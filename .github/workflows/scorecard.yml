name: OSSF Scorecard

# Runs the OpenSSF Scorecard checks (https://github.com/ossf/scorecard) against
# the repository and publishes the result to:
#   - The repository's Security tab (SARIF upload)
#   - https://scorecard.dev/viewer/?uri=github.com/bymaxone/nest-core (public)
#
# The schedule keeps the score fresh even when no code lands; the push trigger
# catches regressions immediately (e.g. branch protection removed). For a
# published library, supply-chain transparency is part of the product.
on:
  push:
    branches: [main]
  schedule:
    # Mondays 04:00 UTC, early enough to catch the weekly Dependabot batch.
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Concurrency keeps one run per ref; a new commit cancels the previous run.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. Specific permissions are widened at the job level.
permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The assignment sits inside `if`, which `set -e` does not act on, so
          # the retry works without disabling error checking for the rest of the
          # step — a failed write to $GITHUB_OUTPUT must still fail the job.
          visibility=""
          for attempt in 1 2 3; do
            if visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null); then
              break
            fi
            visibility=""
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 5 ))
            fi
          done

          if [ -z "$visibility" ]; then
            # Degraded rather than failed: a red workflow over a transient API
            # error is noise, and the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public and skipping."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository: uploading results needs a GitHub Code Security license, which is only free on public repositories."
          fi

  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard publishes to the public scorecard.dev viewer and uploads SARIF
    # to code scanning, both of which require a public repository. Gate on
    # public visibility so the analysis activates once the repository is
    # published and never fails on the default branch while it is private.
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}

    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required for `publish_results: true`, the action mints an OIDC token
      # against scorecard.dev so its public viewer can verify the publisher.
      id-token: write
      # Read-only access to repo contents and workflow metadata.
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scorecard analysis must run against the exact ref that was
          # pushed; with `persist-credentials: false` no token is left behind
          # in the runner after checkout.
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing results is what makes the badge resolve and the public
          # viewer at scorecard.dev show the score. Safe for public repos.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
